spring.application.name=demo
server.port=8080
server.address=0.0.0.0

# ===== Database Configuration (PostgreSQL con Supabase) =====
spring.datasource.url=jdbc:postgresql://aws-1-us-east-1.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.izmtowdzpbkjwpwbmdfa
spring.datasource.password=basepruebas1234
spring.jpa.hibernate.ddl-auto=update
# PARTE 1: Disable show_sql para reducir overhead en producción
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# PARTE 1: Disable format_sql (overhead)
spring.jpa.properties.hibernate.format_sql=false

# PARTE 1: HikariCP Connection Pool Tuning para Supabase
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.leak-detection-threshold=60000

# DATABASE_URL para Prisma (connection pooling)
DATABASE_URL="postgresql://postgres.izmtowdzpbkjwpwbmdfa:basepruebas1234@aws-1-us-east-1.pooler.supabase.com:6543/postgres?pgbouncer=true"
# DIRECT_URL para Prisma (acceso directo)
DIRECT_URL="postgresql://postgres.izmtowdzpbkjwpwbmdfa:basepruebas1234@aws-1-us-east-1.pooler.supabase.com:5432/postgres"

# ===== Flyway Configuration =====
spring.flyway.enabled=false

# H2 for development (uncomment to use instead of PostgreSQL)
# spring.datasource.url=jdbc:h2:mem:testdb
# spring.datasource.driverClassName=org.h2.Driver
# spring.h2.console.enabled=true
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ===== OAuth2 Resource Server - JWT =====
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://fing-auth.ideasybits.com/auth/realms/siac-realm-test
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://fing-auth.ideasybits.com/auth/realms/siac-realm-test/protocol/openid-connect/certs

# ===== Keycloak Token Exchange =====
keycloak.token-url=https://fing-auth.ideasybits.com/auth/realms/siac-realm-test/protocol/openid-connect/token
keycloak.client-id=siac-app-movil
# keycloak.client-secret=

# PARTE 1: Logging estructurado para producción
logging.level.root=INFO
logging.level.com.example.demo=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ===== Hibernate Envers Configuration =====
# Nombre de la tabla de revisiones
spring.jpa.properties.org.hibernate.envers.revision_field_name=rev
spring.jpa.properties.org.hibernate.envers.revision_type_field_name=revtype

# Auditar solo las propiedades modificadas (optimización)
spring.jpa.properties.org.hibernate.envers.global_with_modified_flag=true

# Sufijo para tablas de auditoría
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_AUD

# Almacenar información de eliminación
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true

# ===== Thymeleaf Configuration =====
# PARTE 7: Enable cache in production
spring.thymeleaf.cache=true
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ===== Session Configuration for Thymeleaf =====
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

# ===== Multipart File Upload Configuration =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=12MB

# PARTE 1: Actuator endpoints for monitoring
management.endpoints.web.exposure.include=health,metrics,prometheus,info
management.endpoint.health.show-details=when-authorized
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.enable.logback=true

# PARTE 6: Caffeine Cache Configuration
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=10m
spring.cache.cache-names=usuarios,laboratorios,equipos,novedades