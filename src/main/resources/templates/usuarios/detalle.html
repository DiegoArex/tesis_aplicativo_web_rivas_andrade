<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/global-typography.css" rel="stylesheet">
    <link href="/css/design-system.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
    <style>
        body { padding-top: 20px; }
    </style>
</head>
<body>
    <!-- Navbar Principal -->
    <nav class="navbar navbar-expand-lg sticky-top" style="background-color: var(--color-deep-blue) !important; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
        <!-- Primera sección: Logo y usuario -->
        <div class="container-fluid">
            <a class="navbar-brand" href="/web/dashboard">
                <i class="fas fa-flask me-2"></i>Sistema de Laboratorios FING
            </a>
            <div class="ms-auto d-flex align-items-center">
                <span class="text-white me-3"><i class="fas fa-user-circle me-1"></i> <strong><span sec:authentication="name">Usuario</span></strong></span>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn btn-logout btn-sm"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</button>
                </form>
            </div>
        </div>
    </nav>

    <!-- Segunda sección: Navegación -->
    <nav class="navbar navbar-expand-lg" style="background-color: #f8f9fa !important;">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="/web/dashboard"><i class="fas fa-home"></i> Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="/web/laboratorios"><i class="fas fa-building"></i> Laboratorios</a></li>
                    <li class="nav-item"><a class="nav-link" href="/web/equipos"><i class="fas fa-desktop"></i> Equipos</a></li>
                    <li class="nav-item" sec:authorize="hasAnyRole('ROLE_PROFESOR', 'ROLE_FACULTAD_DIRECTOR_CARRERA', 'ROLE_ADMIN')">
                        <a class="nav-link" href="/web/registros"><i class="fas fa-clipboard-list"></i> Registros</a>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="/web/novedades"><i class="fas fa-exclamation-circle"></i> Novedades</a></li>
                    <li class="nav-item" sec:authorize="hasAnyRole('ROLE_FACULTAD_DIRECTOR_CARRERA', 'ROLE_ADMIN')">
                        <a class="nav-link" href="/web/auditoria"><i class="fas fa-history"></i> Auditoría</a>
                    </li>
<li class="nav-item" sec:authorize="hasRole('ROLE_ADMIN')">
    <a class="nav-link" href="/web/papelera"><i class="fas fa-trash-alt"></i> Papelera</a>
</li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container container-main">
        <div class="header-section">
            <h1><i class="fas fa-user-circle me-2"></i>Detalle de Usuario</h1>
            <a href="/web/dashboard" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left me-1"></i> Volver
            </a>
        </div>

        <div th:if="${mensaje}" th:class="'alert alert-' + ${tipo}" role="alert">
            <span th:text="${mensaje}"></span>
        </div>

        <div class="row g-4">
            <div class="col-md-8">
                <div class="card h-100">
                    <div class="card-header">
                        <i class="fas fa-info-circle me-2"></i>Perfil de Usuario
                    </div>
                    <div class="card-body">
                        <h3 class="mb-4 text-primary" th:text="${usuario.nombreCompleto}">Nombre</h3>
                        <div class="row">
                            <div class="col-sm-6 mb-3">
                                <label class="text-muted small d-block">Usuario (Username)</label>
                                <span class="fw-bold" th:text="${usuario.username}"></span>
                            </div>
                            <div class="col-sm-6 mb-3">
                                <label class="text-muted small d-block">Correo Institucional</label>
                                <span class="fw-bold text-secondary" th:text="${usuario.email}"></span>
                            </div>
                            <div class="col-sm-6 mb-3">
                                <label class="text-muted small d-block">Carrera / Programa</label>
                                <span class="fw-bold text-secondary" th:text="${usuario.carrera}"></span>
                            </div>
                            <div class="col-sm-6 mb-3">
                                <label class="text-muted small d-block">Facultad</label>
                                <span class="fw-bold text-secondary" th:text="${usuario.facultad}"></span>
                            </div>
                            <div class="col-sm-6 mb-3">
                                <label class="text-muted small d-block">Roles Asignados</label>
                                <span class="badge bg-light text-dark border" th:text="${usuario.roles}"></span>
                            </div>
                            <div class="col-sm-6 mb-3">
                                <label class="text-muted small d-block">Estado de Cuenta</label>
                                <span th:if="${usuario.activo}" class="status-badge status-active">Activo</span>
                                <span th:unless="${usuario.activo}" class="status-badge status-inactive">Inactivo</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Gestión de Usuario (comentado por ahora)
            <div class="col-md-4">
                <div class="card h-100 border-0 shadow-sm" style="background-color: var(--color-deep-blue); color: white;">
                    <div class="card-header border-0" style="background: rgba(255,255,255,0.1);">
                        <i class="fas fa-cogs me-2"></i>Gestión de Usuario
                    </div>
                    <div class="card-body d-grid gap-3 p-4">
                        <a th:href="@{/web/usuarios/{id}/editar(id=${usuario.id})}" class="btn btn-light btn-lg">
                            <i class="fas fa-edit me-1 text-primary"></i> Editar Perfil
                        </a>
                        <form th:action="@{/web/usuarios/{id}/desactivar(id=${usuario.id})}" method="post">
                            <button type="submit" class="btn btn-outline-light w-100">
                                <i class="fas fa-user-slash me-1"></i> Desactivar Cuenta
                            </button>
                        </form>
                        <form th:action="@{/web/usuarios/{id}/eliminar(id=${usuario.id})}" method="post" onsubmit="return confirm('¿Está seguro de eliminar este usuario?')">
                            <button type="submit" class="btn btn-danger w-100">
                                <i class="fas fa-trash me-1"></i> Eliminar Definitivamente
                            </button>
                        </form>
                    </div>
                </div>
            </div>
            -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
