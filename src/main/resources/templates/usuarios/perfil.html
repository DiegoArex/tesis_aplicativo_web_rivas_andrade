<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/global-typography.css" rel="stylesheet">
    <link href="/css/design-system.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<!-- Navbar Principal -->
<nav class="navbar navbar-expand-lg sticky-top" style="background-color: var(--color-deep-blue) !important; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
    <!-- Primera sección: Logo y usuario -->
    <div class="container-fluid">
        <a class="navbar-brand" href="/web/dashboard">
            <i class="fas fa-flask me-2"></i>Sistema de Laboratorios FING
        </a>
        <div class="ms-auto d-flex align-items-center">
            <span class="text-white me-3"><i class="fas fa-user-circle me-1"></i> <strong><span sec:authentication="name">Usuario</span></strong></span>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn btn-logout btn-sm"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</button>
            </form>
        </div>
    </div>
</nav>

<!-- Segunda sección: Navegación -->
<nav class="navbar navbar-expand-lg" style="background-color: #f8f9fa !important;">
    <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="/web/dashboard"><i class="fas fa-home"></i> Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="/web/laboratorios"><i class="fas fa-building"></i> Laboratorios</a></li>
                <li class="nav-item"><a class="nav-link" href="/web/equipos"><i class="fas fa-desktop"></i> Equipos</a></li>
                <li class="nav-item" sec:authorize="hasAnyRole('ROLE_PROFESOR', 'ROLE_FACULTAD_DIRECTOR_CARRERA', 'ROLE_ADMIN')">
                    <a class="nav-link" href="/web/registros"><i class="fas fa-clipboard-list"></i> Registros</a>
                </li>
                <li class="nav-item"><a class="nav-link" href="/web/novedades"><i class="fas fa-exclamation-circle"></i> Novedades</a></li>
                <li class="nav-item" sec:authorize="hasAnyRole('ROLE_FACULTAD_DIRECTOR_CARRERA', 'ROLE_ADMIN')">
                    <a class="nav-link" href="/web/auditoria"><i class="fas fa-history"></i> Auditoría</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <i class="fas fa-id-badge me-2"></i>Mi Perfil
        </div>
        <div class="card-body">
            <h4 th:text="${usuario.nombreCompleto}">Nombre</h4>
            <p><strong>Username:</strong> <span th:text="${usuario.username}"></span></p>
            <p><strong>Email:</strong> <span th:text="${usuario.email}"></span></p>
            <p><strong>Carrera:</strong> <span th:text="${usuario.carrera}"></span></p>
            <p><strong>Facultad:</strong> <span th:text="${usuario.facultad}"></span></p>
            <p><strong>Roles:</strong> <span th:text="${usuario.roles}"></span></p>
            <p><strong>Estado:</strong>
                <span th:if="${usuario.activo}" class="badge bg-success">Activo</span>
                <span th:unless="${usuario.activo}" class="badge bg-danger">Inactivo</span>
            </p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
