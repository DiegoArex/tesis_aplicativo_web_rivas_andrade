<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/global-typography.css" rel="stylesheet">
    <link href="/css/design-system.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<!-- Navbar Principal -->
<nav class="navbar navbar-expand-lg sticky-top" style="background-color: var(--color-deep-blue) !important; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
    <!-- Primera sección: Logo y usuario -->
    <div class="container-fluid">
        <a class="navbar-brand" href="/web/dashboard">
            <i class="fas fa-flask me-2"></i>Sistema de Laboratorios FING
        </a>
        <div class="ms-auto d-flex align-items-center">
            <span class="text-white me-3"><i class="fas fa-user-circle me-1"></i> <strong><span sec:authentication="name">Usuario</span></strong></span>
            <form th:action="@{/logout}" method="post" class="d-inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn btn-logout btn-sm"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</button>
            </form>
        </div>
    </div>
</nav>

<!-- Segunda sección: Navegación -->
<nav class="navbar navbar-expand-lg" style="background-color: #f8f9fa !important;">
    <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="/web/dashboard"><i class="fas fa-home"></i> Inicio</a></li>
                <li class="nav-item"><a class="nav-link" href="/web/laboratorios"><i class="fas fa-building"></i> Laboratorios</a></li>
                <li class="nav-item"><a class="nav-link" href="/web/equipos"><i class="fas fa-desktop"></i> Equipos</a></li>
                <li class="nav-item" sec:authorize="hasAnyRole('ROLE_PROFESOR', 'ROLE_FACULTAD_DIRECTOR_CARRERA', 'ROLE_ADMIN')">
                    <a class="nav-link" href="/web/registros"><i class="fas fa-clipboard-list"></i> Registros</a>
                </li>
                <li class="nav-item"><a class="nav-link" href="/web/novedades"><i class="fas fa-exclamation-circle"></i> Novedades</a></li>
                <li class="nav-item" sec:authorize="hasAnyRole('ROLE_FACULTAD_DIRECTOR_CARRERA', 'ROLE_ADMIN')">
                    <a class="nav-link" href="/web/auditoria"><i class="fas fa-history"></i> Auditoría</a>
                </li>
<li class="nav-item" sec:authorize="hasRole('ROLE_ADMIN')">
    <a class="nav-link" href="/web/papelera"><i class="fas fa-trash-alt"></i> Papelera</a>
</li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2><i class="fas fa-users me-2"></i><span th:text="${titulo}">Usuario</span></h2>
    </div>
</div>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/web/dashboard">
                <i class="fas fa-flask me-2"></i>Sistema de Laboratorios FING
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/web/dashboard"><i class="fas fa-home"></i> Inicio</a></li>
                </ul>
            </div>
            <div class="ms-auto">
                <span class="text-white me-3">
                    <i class="fas fa-user-circle me-1"></i>
                    <span sec:authentication="name">Usuario</span>
                </span>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light btn-sm">
                        <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container container-main" style="max-width: 800px;">
        <div class="header-section">
            <h1><i class="fas fa-user-plus me-2"></i><span th:text="${titulo}">Usuario</span></h1>
            <a href="/web/dashboard" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left me-1"></i> Volver
            </a>
        </div>

    <div th:if="${error}" class="alert alert-danger" role="alert">
        <span th:text="${error}"></span>
    </div>

    <div class="card">
        <div class="card-header bg-primary text-white">
            <i class="fas fa-edit me-2"></i><span th:text="${accion}">Acción</span>
        </div>
        <div class="card-body">
            <form th:action="${usuarioId} != null ? @{/web/usuarios/{id}/editar(id=${usuarioId})} : @{/web/usuarios}" th:object="${usuario}" method="post">
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" th:field="*{username}" placeholder="usuario1">
                        <div class="text-danger" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" th:field="*{email}" placeholder="usuario@universidad.edu">
                        <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Nombre Completo</label>
                        <input type="text" class="form-control" th:field="*{nombreCompleto}" placeholder="Nombre Apellido">
                        <div class="text-danger" th:if="${#fields.hasErrors('nombreCompleto')}" th:errors="*{nombreCompleto}"></div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Roles (separados por coma)</label>
                        <input type="text" class="form-control" th:field="*{roles}" placeholder="ROLE_ADMIN,ROLE_PROFESOR">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Carrera</label>
                        <input type="text" class="form-control" th:field="*{carrera}" placeholder="Ingeniería de Sistemas">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Facultad</label>
                        <input type="text" class="form-control" th:field="*{facultad}" placeholder="FING">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Activo</label>
                        <select class="form-select" th:field="*{activo}">
                            <option th:value="true">Activo</option>
                            <option th:value="false">Inactivo</option>
                        </select>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="/web/dashboard" class="btn btn-outline-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save me-1"></i> Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
