<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Equipo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/global-typography.css" rel="stylesheet">
    <link href="/css/design-system.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { padding-top: 20px; }
    </style>
</head>
<body>
    <!-- Navbar Principal -->
    <nav class="navbar navbar-expand-lg sticky-top" style="background-color: var(--color-deep-blue) !important; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
        <!-- Primera sección: Logo y usuario -->
        <div class="container-fluid">
            <a class="navbar-brand" href="/web/dashboard">
                <i class="fas fa-flask me-2"></i>Sistema de Laboratorios FING
            </a>
            <div class="ms-auto d-flex align-items-center">
                <span class="text-white me-3"><i class="fas fa-user-circle me-1"></i> <strong><span sec:authentication="name">Usuario</span></strong></span>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn btn-logout btn-sm"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</button>
                </form>
            </div>
        </div>
    </nav>

    <!-- Segunda sección: Navegación -->
    <nav class="navbar navbar-expand-lg" style="background-color: #f8f9fa !important;">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="/web/dashboard"><i class="fas fa-home"></i> Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="/web/laboratorios"><i class="fas fa-building"></i> Laboratorios</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/web/equipos"><i class="fas fa-desktop"></i> Equipos</a></li>
                    <li class="nav-item" sec:authorize="hasAnyRole('ROLE_PROFESOR', 'ROLE_FACULTAD_DIRECTOR_CARRERA', 'ROLE_ADMIN')">
                        <a class="nav-link" href="/web/registros"><i class="fas fa-clipboard-list"></i> Registros</a>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="/web/novedades"><i class="fas fa-exclamation-circle"></i> Novedades</a></li>
                    <li class="nav-item" sec:authorize="hasAnyRole('ROLE_FACULTAD_DIRECTOR_CARRERA', 'ROLE_ADMIN')">
                        <a class="nav-link" href="/web/auditoria"><i class="fas fa-history"></i> Auditoría</a>
                    </li>
<li class="nav-item" sec:authorize="hasRole('ROLE_ADMIN')">
    <a class="nav-link" href="/web/papelera"><i class="fas fa-trash-alt"></i> Papelera</a>
</li>
                </ul>
            </div>
        </div>
    </nav>
                </form>
            </div>
        </div>
    </nav>

    <div class="container container-main" style="max-width: 800px;">
        <div class="header-section">
            <h1><i class="fas fa-desktop me-2"></i><span th:text="${titulo}">Equipo</span></h1>
            <a href="/web/equipos" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left me-1"></i> Volver
            </a>
        </div>

        <div th:if="${error}" class="alert alert-danger" role="alert">
            <span th:text="${error}"></span>
        </div>

        <form th:action="${equipoId} != null ? @{/web/equipos/{id}/editar(id=${equipoId})} : @{/web/equipos}" th:object="${equipo}" method="post">
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Código</label>
                    <input type="text" class="form-control" th:field="*{codigo}" placeholder="EQ-001">
                    <div class="text-danger" th:if="${#fields.hasErrors('codigo')}" th:errors="*{codigo}"></div>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Tipo</label>
                    <input type="text" class="form-control" th:field="*{tipo}" placeholder="Computador, Proyector">
                    <div class="text-danger" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></div>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Estado</label>
                    <select class="form-select" th:field="*{estado}">
                        <option value="OPERATIVO">OPERATIVO</option>
                        <option value="EN_MANTENIMIENTO">EN_MANTENIMIENTO</option>
                        <option value="DAÑADO">DAÑADO</option>
                        <option value="FUERA_DE_SERVICIO">FUERA_DE_SERVICIO</option>
                    </select>
                    <div class="text-danger" th:if="${#fields.hasErrors('estado')}" th:errors="*{estado}"></div>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Marca</label>
                    <input type="text" class="form-control" th:field="*{marca}" placeholder="Marca">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Modelo</label>
                    <input type="text" class="form-control" th:field="*{modelo}" placeholder="Modelo">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Número de Serie</label>
                    <input type="text" class="form-control" th:field="*{numeroSerie}" placeholder="NS-123">
                </div>
                <div class="col-md-12 mb-3">
                    <label class="form-label">Laboratorio</label>
                    <select class="form-select" th:field="*{laboratorioId}">
                        <option value="" disabled>Seleccione un laboratorio</option>
                        <option th:each="lab : ${laboratorios}" th:value="${lab.id}" th:text="${lab.nombre}"></option>
                    </select>
                    <div class="text-danger" th:if="${#fields.hasErrors('laboratorioId')}" th:errors="*{laboratorioId}"></div>
                </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4">
                <a href="/web/equipos" class="btn btn-outline-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save me-1"></i> Guardar Equipo
                </button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
