<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios Eliminados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/global-typography.css" rel="stylesheet">
    <link href="/css/design-system.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
    <style>
        body { padding-top: 20px; }
    </style>
</head>
<body>
    <!-- Navbar Principal -->
    <nav class="navbar navbar-expand-lg sticky-top" style="background-color: var(--color-deep-blue) !important; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
        <!-- Primera sección: Logo y usuario -->
        <div class="container-fluid">
            <a class="navbar-brand" href="/web/dashboard">
                <i class="fas fa-flask me-2"></i>Sistema de Laboratorios FING
            </a>
            <div class="ms-auto d-flex align-items-center">
                <span class="text-white me-3"><i class="fas fa-user-circle me-1"></i> <strong><span sec:authentication="name">Usuario</span></strong></span>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn btn-logout btn-sm"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</button>
                </form>
            </div>
        </div>
    </nav>

    <!-- Segunda sección: Navegación -->
    <nav class="navbar navbar-expand-lg" style="background-color: #f8f9fa !important;">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="/web/dashboard"><i class="fas fa-home"></i> Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="/web/laboratorios"><i class="fas fa-building"></i> Laboratorios</a></li>
                    <li class="nav-item"><a class="nav-link" href="/web/equipos"><i class="fas fa-desktop"></i> Equipos</a></li>
                    <li class="nav-item" sec:authorize="hasAnyRole('ROLE_PROFESOR', 'ROLE_FACULTAD_DIRECTOR_CARRERA', 'ROLE_ADMIN')">
                        <a class="nav-link" href="/web/registros"><i class="fas fa-clipboard-list"></i> Registros</a>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="/web/novedades"><i class="fas fa-exclamation-circle"></i> Novedades</a></li>
                    <li class="nav-item" sec:authorize="hasAnyRole('ROLE_FACULTAD_DIRECTOR_CARRERA', 'ROLE_ADMIN')">
                        <a class="nav-link" href="/web/auditoria"><i class="fas fa-history"></i> Auditoría</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container container-main">
        <div class="header-section">
            <div>
                <h1><i class="fas fa-user-slash me-2 text-danger"></i>Papelera de Usuarios</h1>

            </div>
            <a href="/web/dashboard" class="btn btn-outline-secondary">
                <i class="fas fa-arrow-left me-1"></i> Volver
            </a>
        </div>

        <div th:if="${mensaje}" th:class="'alert alert-' + ${tipo}" role="alert">
            <span th:text="${mensaje}"></span>
        </div>

        <div class="card">
            <div class="card-header bg-danger text-white">
                <i class="fas fa-history me-2"></i>Registros en Papelera
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Username</th>
                                <th>Email</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="u : ${usuarios}">
                                <td th:text="${u.id}"></td>
                                <td class="fw-bold" th:text="${u.nombreCompleto}"></td>
                                <td th:text="${u.username}"></td>
                                <td th:text="${u.email}"></td>
                                <td class="text-center">
                                    <div class="btn-group">
                                        <form th:action="@{/web/usuarios/{id}/restore(id=${u.id})}" method="post" class="d-inline">
                                            <button type="submit" class="btn btn-sm btn-outline-success" title="Restaurar">
                                                <i class="fas fa-undo"></i> Restaurar
                                            </button>
                                        </form>
                                        <form th:action="@{/web/usuarios/{id}/hard-delete(id=${u.id})}" method="post" class="d-inline ms-1" onsubmit="return confirm('¿Eliminar permanentemente?')">
                                            <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar Definitivamente">
                                                <i class="fas fa-times"></i> Borrar
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${usuarios.empty}">
                                <td colspan="5" class="text-center py-4 text-muted">
                                    <i class="fas fa-user-slash fa-2x mb-2 d-block opacity-25"></i>
                                    No hay usuarios en la papelera.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
